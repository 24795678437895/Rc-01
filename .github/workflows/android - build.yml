

name: Rc-01 Android APK Build

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Rc-01 APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Extract Unity Project
        run: |
          mkdir -p extracted
          unzip -q RC-01_v8_Unity_Project_Updated.zip -d extracted
          SETTINGS=$(find extracted -type d -name ProjectSettings | head -1)
          test -n "$SETTINGS"
          PROJECT=$(dirname "$SETTINGS")
          test -d "$PROJECT/Assets"
          test -d "$PROJECT/Packages"
          echo "PROJECT_PATH=$PROJECT" >> $GITHUB_ENV

      - name: Build APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        with:
          projectPath: ${{ env.PROJECT_PATH }}
          unityVersion: 2022.3.62f1
          targetPlatform: Android
          androidExportType: androidPackage
          buildsPath: build
          buildName: Rc-01

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Rc-01-Android-APK
          path: build/**/*.apk
          if-no-files-found: error
          
          


      
